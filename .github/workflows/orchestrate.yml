name: Competition Orchestrator

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour, UTC
  workflow_dispatch: {}     # lets you manually trigger a run from the Actions tab too

permissions:
  contents: write   # needed so this workflow can commit/push updated CSVs

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run orchestrator
        run: python orchestrate.py

      - name: Commit and push any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Automated update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
