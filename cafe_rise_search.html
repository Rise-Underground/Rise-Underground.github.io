<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cafe Rise Transcript Search</title>
<style>
  :root{
    --bg: #0f1210;
    --panel: #171b18;
    --line: #2a312c;
    --ink: #e7e4d8;
    --dim: #8b9186;
    --accent: #c9a24a;
    --accent-dim: #6b5a2c;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --serif: "Georgia", "Iowan Old Style", serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.5;
  }
  header{
    padding:28px 24px 18px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0 0 4px;
    font-family:var(--mono);
    font-weight:600;
    font-size:20px;
    letter-spacing:0.5px;
    color:var(--accent);
  }
  header p{
    margin:0;
    color:var(--dim);
    font-size:13px;
    font-family:var(--mono);
  }
  #status{
    padding:10px 24px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
    border-bottom:1px solid var(--line);
  }
  .search-wrap{
    padding:20px 24px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  #q{
    width:100%;
    padding:12px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--mono);
    font-size:15px;
    outline:none;
    border-radius:2px;
  }
  #q:focus{border-color:var(--accent);}
  #count{
    margin-top:8px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
  }
  main{padding:12px 24px 60px; max-width:900px;}
  .result{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:3px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .result-head{
    padding:12px 16px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
  }
  .result-head:hover{background:#1c211d;}
  .ep-title{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent);
    letter-spacing:0.3px;
  }
  .timestamp{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    white-space:nowrap;
  }
  .snippet{
    padding:0 16px 12px;
    font-size:15px;
    color:var(--ink);
  }
  .snippet mark{
    background:var(--accent-dim);
    color:#fff5da;
    padding:0 2px;
    border-radius:2px;
  }
  .context{
    display:none;
    border-top:1px solid var(--line);
    padding:14px 16px;
    background:#12150f13;
  }
  .context.open{display:block;}
  .ctx-line{
    font-size:14px;
    color:var(--dim);
    margin-bottom:6px;
    padding-left:8px;
    border-left:2px solid var(--line);
  }
  .ctx-line.hit{
    color:var(--ink);
    border-left-color:var(--accent);
    font-weight:600;
  }
  .ctx-line .t{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    margin-right:8px;
  }
  .ctx-controls{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-family:var(--mono);
    font-size:11px;
  }
  .ctx-controls button, .yt-link{
    background:none;
    border:1px solid var(--line);
    color:var(--accent);
    font-family:var(--mono);
    font-size:11px;
    padding:6px 10px;
    cursor:pointer;
    border-radius:2px;
    text-decoration:none;
  }
  .ctx-controls button:hover, .yt-link:hover{border-color:var(--accent);}
  #empty{
    color:var(--dim);
    font-family:var(--mono);
    font-size:13px;
    padding:40px 0;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>CAFE RISE — TRANSCRIPT SEARCH</h1>
  <p>searches every loaded episode, line by line</p>
</header>

<div id="status">loading episodes…</div>

<div class="search-wrap">
  <input id="q" type="text" placeholder="search a word or phrase…" autocomplete="off">
  <div id="count"></div>
</div>

<main id="results">
  <div id="empty">start typing to search</div>
</main>

<script>
const CONTEXT_STEP = 6; // lines shown before/after on first expand, and per "show more" click

let episodes = []; // { title, url, slug, lines: [{start, duration, text}] }
let allLines = [];  // flattened: { epIndex, lineIndex, start, text }

async function tryLoad(path){
  try{
    const res = await fetch(path);
    if (!res.ok) return null;
    return await res.json();
  } catch(e){
    return null;
  }
}

function addEpisode(data, fallbackTitle){
  const epIndex = episodes.length;
  episodes.push({
    title: data.title || fallbackTitle,
    url: data.url || '',
    lines: data.transcript || []
  });
  (data.transcript || []).forEach((line, lineIndex) => {
    allLines.push({ epIndex, lineIndex, start: line.start, text: line.text });
  });
}

async function loadEpisodes(){
  const statusEl = document.getElementById('status');
  let found = 0, misses = 0, i = 1;
  const MAX_MISSES = 5, MAX_TRY = 300;

  while (misses < MAX_MISSES && i <= MAX_TRY){
    // try the plain filename first
    const plain = await tryLoad(`Cafe Rise/Cafe Rise Episode ${i}.json`);
    if (plain){
      addEpisode(plain, `Episode ${i}`);
      found++;
      misses = 0;
      i++;
      continue;
    }

    // fall back to "part 1" / "part 2" (and beyond, just in case) variants
    let partFound = false;
    let part = 1;
    while (true){
      const data = await tryLoad(`Cafe Rise/Cafe Rise Episode ${i} part ${part}.json`);
      if (!data) break;
      addEpisode(data, `Episode ${i} Part ${part}`);
      found++;
      partFound = true;
      part++;
    }

    if (partFound){
      misses = 0;
    } else {
      misses++;
    }
    i++;
  }

  statusEl.textContent = found > 0
    ? `${found} episode${found === 1 ? '' : 's'} loaded — ${allLines.length} lines indexed`
    : `no episodes found — check that this file sits next to a "Cafe Rise" folder, and that you're running a local server (not opening the file directly)`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  const mm = String(m).padStart(h ? 2 : 1, '0');
  const ss = String(s).padStart(2,'0');
  return h ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

function highlight(text, q){
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) +
    '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' +
    escapeHtml(text.slice(idx+q.length));
}

function runSearch(q){
  const resultsEl = document.getElementById('results');
  const countEl = document.getElementById('count');
  resultsEl.innerHTML = '';

  if (!q.trim()){
    resultsEl.innerHTML = '<div id="empty">start typing to search</div>';
    countEl.textContent = '';
    return;
  }

  const qLower = q.toLowerCase();
  const matches = allLines.filter(l => l.text.toLowerCase().includes(qLower));
  countEl.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'}`;

  if (matches.length === 0){
    resultsEl.innerHTML = '<div id="empty">no matches</div>';
    return;
  }

  matches.slice(0, 300).forEach(m => {
    const ep = episodes[m.epIndex];
    const card = document.createElement('div');
    card.className = 'result';

    const head = document.createElement('div');
    head.className = 'result-head';
    head.innerHTML = `<span class="ep-title">${escapeHtml(ep.title)}</span><span class="timestamp">${fmtTime(m.start)}</span>`;

    const snippet = document.createElement('div');
    snippet.className = 'snippet';
    snippet.innerHTML = highlight(m.text, q);

    const context = document.createElement('div');
    context.className = 'context';
    let before = CONTEXT_STEP, after = CONTEXT_STEP;

    function renderContext(){
      const startIdx = Math.max(0, m.lineIndex - before);
      const endIdx = Math.min(ep.lines.length - 1, m.lineIndex + after);
      let html = '';
      for (let idx = startIdx; idx <= endIdx; idx++){
        const line = ep.lines[idx];
        const isHit = idx === m.lineIndex;
        html += `<div class="ctx-line ${isHit ? 'hit' : ''}"><span class="t">${fmtTime(line.start)}</span>${escapeHtml(line.text)}</div>`;
      }
      const ytLink = ep.url ? `<a class="yt-link" target="_blank" href="${ep.url}&t=${Math.floor(m.start)}s">watch on youtube ↗</a>` : '<span></span>';
      html += `<div class="ctx-controls">
        <button data-dir="before" ${startIdx === 0 ? 'disabled' : ''}>← more before</button>
        ${ytLink}
        <button data-dir="after" ${endIdx === ep.lines.length - 1 ? 'disabled' : ''}>more after →</button>
      </div>`;
      context.innerHTML = html;
      context.querySelectorAll('button[data-dir]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (btn.dataset.dir === 'before') before += CONTEXT_STEP;
          else after += CONTEXT_STEP;
          renderContext();
        });
      });
    }

    head.addEventListener('click', () => {
      const isOpen = context.classList.contains('open');
      if (!isOpen && context.innerHTML === ''){
        renderContext();
      }
      context.classList.toggle('open');
    });

    card.appendChild(head);
    card.appendChild(snippet);
    card.appendChild(context);
    resultsEl.appendChild(card);
  });

  if (matches.length > 300){
    const note = document.createElement('div');
    note.id = 'empty';
    note.textContent = `showing first 300 of ${matches.length} matches — narrow your search`;
    resultsEl.appendChild(note);
  }
}

let debounceTimer;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runSearch(e.target.value), 120);
});

loadEpisodes();
</script>

</body>
</html>
