<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISE Underground</title>
<style>
  @font-face {
    font-family: 'Bebas';
    src: local('Bebas Neue');
  }

  :root {
    --black: #0a0908;
    --black-deep: #050403;
    --gold: #d9a441;
    --gold-bright: #f2c057;
    --red: #c81e1e;
    --red-dim: #7a1414;
    --off-white: #ede6d6;
    --grey: #6b6459;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--off-white);
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background: #000000;
    position: relative;
  }

  /* faint scanline / vault texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.015),
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 1;
  }

  .stage {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6vh 20px 4vh;
    z-index: 2;
  }

  .logo-wrap {
    position: relative;
    width: min(88vw, 640px);
    aspect-ratio: 854 / 480;
  }

  video#logo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    mix-blend-mode: screen;
  }

  @keyframes glow-in {
    to { opacity: 1; }
  }

  .tagline {
    margin-top: 18px;
    letter-spacing: 0.42em;
    font-size: 11px;
    color: var(--grey);
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(6px);
    animation: rise-in 0.8s ease-out 2.6s forwards;
  }

  /* --- Menu reveal --- */
  .menu {
    margin-top: 48px;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise-in 0.9s cubic-bezier(.2,.8,.2,1) 3s forwards;
  }

  @keyframes rise-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .menu-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .menu-divider::before,
  .menu-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    opacity: 0.5;
  }

  .menu-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.2));
    border: 1px solid rgba(217,164,65,0.35);
    color: var(--off-white);
    text-decoration: none;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, padding-left 0.25s ease;
  }

  .menu-item:hover,
  .menu-item:focus-visible {
    border-color: var(--gold-bright);
    background: linear-gradient(180deg, rgba(217,164,65,0.14), rgba(0,0,0,0.25));
    padding-left: 28px;
    outline: none;
  }

  .menu-item:hover .menu-arrow,
  .menu-item:focus-visible .menu-arrow {
    transform: translateX(4px);
    color: var(--gold-bright);
  }

  .menu-item.is-disabled {
    cursor: default;
    opacity: 0.55;
    border-color: rgba(217,164,65,0.15);
  }

  .menu-item.is-disabled:hover,
  .menu-item.is-disabled:focus-visible {
    border-color: rgba(217,164,65,0.15);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.2));
    padding-left: 22px;
  }

  .menu-item.is-disabled .menu-arrow {
    visibility: hidden;
  }

  .coming-soon-tag {
    font-family: 'Oswald', monospace;
    font-size: 10px;
    color: var(--grey);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .menu-item-label {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .menu-index {
    font-family: 'Oswald', monospace;
    font-size: 12px;
    color: var(--red);
    letter-spacing: 0.1em;
  }

  .menu-arrow {
    color: var(--grey);
    font-size: 18px;
    transition: transform 0.25s ease, color 0.25s ease;
  }

  footer {
    margin-top: auto;
    padding: 28px 20px 20px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--grey);
    text-transform: uppercase;
    z-index: 2;
    opacity: 0;
    animation: rise-in 0.8s ease-out 3.3s forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .social-links {
    display: flex;
    gap: 16px;
  }

  .social-link {
    color: var(--grey);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 1px solid rgba(217,164,65,0.25);
    border-radius: 50%;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .social-link:hover,
  .social-link:focus-visible {
    color: var(--gold-bright);
    border-color: var(--gold-bright);
    background: rgba(217,164,65,0.08);
    outline: none;
  }

  .social-link svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap::after,
    .tagline,
    .menu,
    footer {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="logo-wrap">
      <video id="logo" autoplay muted playsinline>
        <source src="assets/riseug_logo.mp4" type="video/mp4">
      </video>
    </div>

    <nav class="menu" aria-label="Main menu">
      <div class="menu-divider">Access</div>
      <div class="menu-item is-disabled" aria-disabled="true">
        <span class="menu-item-label">
          NFT Tracker
        </span>
        <span class="coming-soon-tag">Coming Soon</span>
      </div>
      <a class="menu-item" href="leaderboard.html">
        <span class="menu-item-label">
          Leader of the Leader Boards
        </span>
        <span class="menu-arrow">&rarr;</span>
      </a>
    </nav>
  </div>

  <footer>
    <a class="social-link" href="https://x.com/RiseUGX" target="_blank" rel="noopener noreferrer" aria-label="RISE Underground on X">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>
  </footer>

  <script>
    // Freeze on the last frame once the intro animation finishes,
    // rather than looping the video indefinitely.
    const logo = document.getElementById('logo');
    logo.addEventListener('ended', () => {
      logo.currentTime = logo.duration;
      logo.pause();
    });
  </script>

</body>
</html>
